<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/img/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="shortcut icon" href="assets/img/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Ondra Hladík" />
  <link rel="manifest" href="assets/img/site.webmanifest" />

  <title>Projects</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <link rel="stylesheet" href="assets/css/projects.css">
  <link rel="stylesheet" href="assets/css/shared.css">
</head>

<body class="text-slate-200 font-mono min-h-screen flex flex-col">

  <!-- TOP BAR -->
  <header class="border-b border-slate-800 relative z-50 bg-[#020617]/80 backdrop-blur-sm">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4 text-sm">
        <span class="text-slate-300">Ondřej Hladík</span>
      </div>

      <nav class="hidden md:flex items-center gap-6">
        <a href="projects" class="text-sm text-slate-400">PROJECTS</a>
        <a href="showcase" class="text-sm text-slate-400">SHOWCASE</a>
        <a href="contact" class="text-sm text-slate-400">CONTACT</a>
      </nav>

      <span class="hidden md:block text-xs text-slate-500" data-global="last-update"></span>

      <!-- Mobile Menu Button -->
      <button id="mobile-menu-btn" class="md:hidden text-slate-400 hover:text-white p-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu"
      class="hidden md:hidden absolute top-16 left-0 w-full bg-slate-900/95 border-b border-slate-800 p-6 backdrop-blur-sm">
      <nav class="flex flex-col gap-4">
        <a href="projects" class="text-slate-400 block py-2">PROJECTS</a>
        <a href="showcase" class="text-slate-400 block py-2">SHOWCASE</a>
        <a href="contact" class="text-slate-400 block py-2">CONTACT</a>
      </nav>
      <div class="mt-4 pt-4 border-t border-slate-800 text-xs text-slate-500">
        <span data-global="last-update"></span>
      </div>
    </div>
  </header>

  <script>
    document.getElementById('mobile-menu-btn').addEventListener('click', function () {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    });

    (function () {
      const links = document.querySelectorAll('nav a');
      links.forEach(a => {
        try {
          const href = new URL(a.href).pathname.split('/').pop();
          const page = location.pathname.split('/').pop() || 'projects';
          if (href === page) a.classList.add('active');
        } catch (e) { }
      });
    })();
  </script>

  <main class="flex-grow max-w-7xl mx-auto px-6 py-16 space-y-20 w-full" id="projects-content"></main>

  <script>
    const projectsContent = document.getElementById('projects-content');

    function createLink(text, url, className) {
      if (!url) {
        const element = document.createElement('span');
        element.textContent = text;
        element.className = className;
        return element;
      }

      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = text;
      link.className = className;
      return link;
    }

    function renderProject(project) {
      const panel = document.createElement('div');
      panel.className = `panel ${project.type}`;

      const head = document.createElement('div');
      head.className = 'panel-head';
      const name = createLink(project.name, project.url, 'panel-name');
      if (project.url) name.classList.add('hover:text-sky-400', 'transition-colors');
      head.appendChild(name);

      if (project.state) {
        const state = document.createElement('span');
        state.className = 'state';
        const stateLink = createLink(project.state.label, project.state.url, '');
        const icon = document.createElement('i');
        icon.className = project.state.iconClass;
        stateLink.prepend(icon);
        state.appendChild(stateLink);
        head.appendChild(state);
      }
      panel.appendChild(head);

      const description = document.createElement('p');
      description.className = 'panel-desc';
      description.textContent = project.description;
      panel.appendChild(description);

      const technologies = document.createElement('div');
      technologies.className = 'panel-tech';
      project.technologies.forEach(function (technology) {
        const icon = document.createElement('i');
        icon.className = technology.className;
        technologies.appendChild(icon);
      });
      panel.appendChild(technologies);

      const meta = document.createElement('div');
      meta.className = 'panel-meta';
      const since = document.createElement('span');
      since.textContent = `since ${project.since}`;
      meta.appendChild(since);
      panel.appendChild(meta);

      return panel;
    }

    function applyGlobalConfig(config) {
      document.querySelectorAll('[data-global="last-update"]').forEach(function (element) {
        element.textContent = `updated: ${config.global.lastUpdate}`;
      });
    }

    function renderProjects(config) {
      config.categories.forEach(function (category) {
        const activeProjects = category.projects.filter(function (project) {
          return project.active;
        });
        if (!activeProjects.length) return;

        const section = document.createElement('section');
        const title = document.createElement('h2');
        title.className = 'panel-title';
        title.textContent = category.title;
        section.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'grid gap-6 md:grid-cols-2 xl:grid-cols-3';
        activeProjects.forEach(function (project) {
          grid.appendChild(renderProject(project));
        });
        section.appendChild(grid);
        projectsContent.appendChild(section);
      });
    }

    fetch('config.json')
      .then(function (response) {
        if (!response.ok) throw new Error(`config.json returned ${response.status}`);
        return response.json();
      })
      .then(function (config) {
        applyGlobalConfig(config);
        renderProjects(config);
        document.getElementById('site-footer').classList.replace('invisible', 'visible');
      })
      .catch(function (error) {
        console.error('Unable to load project configuration:', error);
        projectsContent.textContent = 'Projekty se nepodařilo načíst.';
        document.getElementById('site-footer').classList.replace('invisible', 'visible');
      });
  </script>

  <footer id="site-footer" class="invisible mt-auto text-xs text-slate-500 px-6 py-8 border-t border-slate-800 text-center">
    <p>© 2026 Ondra Hladík</p>
  </footer>

</body>

</html>
